name: RAGnos Paperclip Fork Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Current 40-character codex/paperclip-stable head with green fork CI
        required: true
        type: string
      version:
        description: RAGnos fork version, for example 0.1.1
        required: true
        type: string

      export_only:
        description: Export an existing release image for private host delivery
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: paperclip-ragnos-fork-release
  cancel-in-progress: false

jobs:
  export_image:
    if: inputs.export_only && github.repository == 'ragnos-labs/paperclip'
    name: Export published image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Resolve published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$VERSION" | grep -Eq '^0\.[0-9]+\.[0-9]+$'
          gh release download "ragnos/v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern release-receipt.json
          jq -e --arg sha "$SOURCE_SHA" --arg version "$VERSION" --arg repo "$GITHUB_REPOSITORY" \
            '.source_sha == $sha and .version == $version and .repository == $repo and (.image_digest | test("^sha256:[0-9a-f]{64}$"))' release-receipt.json
          echo "image=ghcr.io/$GITHUB_REPOSITORY@$(jq -r .image_digest release-receipt.json)" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Export existing image without rebuilding
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          skopeo copy --all --preserve-digests "docker://$IMAGE" oci-archive:paperclip-image.tar:ghcr.io/ragnos-labs/paperclip
      - name: Upload private image archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paperclip-private-image
          path: |
            paperclip-image.tar
            release-receipt.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish_image:
    if: ${{ !inputs.export_only }}
    name: Publish RAGnos image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      checks: read
      contents: write
      packages: write

    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Validate source and version
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$INPUT_SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "source_sha must be an exact lowercase 40-character Git commit." >&2
            exit 1
          fi
          if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^0\.[0-9]+\.[0-9]+$'; then
            echo "version must be a stable fork semantic version below 1.0.0." >&2
            exit 1
          fi

          SOURCE_SHA="$INPUT_SOURCE_SHA" node .github/scripts/ragnos-fork-release-source.mjs
          release_tag="ragnos/v${INPUT_VERSION}"
          if [ -n "$(git ls-remote origin "refs/tags/${release_tag}")" ]; then
            echo "The release tag ${release_tag} already exists." >&2
            exit 1
          fi

          {
            echo "source_sha=$INPUT_SOURCE_SHA"
            echo "version=$INPUT_VERSION"
            echo "release_tag=$release_tag"
            echo "image_tag=ragnos-${INPUT_VERSION}"
            echo "source_image_tag=sha-${INPUT_SOURCE_SHA}"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse existing or ambiguous image tags
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          SOURCE_IMAGE_TAG: ${{ steps.identity.outputs.source_image_tag }}
          VERSION_IMAGE_TAG: ${{ steps.identity.outputs.image_tag }}
        run: |
          set -euo pipefail

          require_registry_reference_absent() {
            local reference="$1"
            local output
            local inspect_status
            set +e
            output="$(docker buildx imagetools inspect "$reference" 2>&1)"
            inspect_status=$?
            set -e
            printf '%s' "$output" | node .github/scripts/registry-reference-guard.mjs \
              --reference "$reference" \
              --status "$inspect_status"
          }

          require_registry_reference_absent "$IMAGE:$VERSION_IMAGE_TAG"
          require_registry_reference_absent "$IMAGE:$SOURCE_IMAGE_TAG"

      - name: Compute migration identity
        id: migrations
        run: |
          set -euo pipefail
          {
            find packages/db/src/migrations -maxdepth 1 -type f -name '*.sql' -print
            printf '%s\n' packages/db/src/migrations/meta/_journal.json
          } | LC_ALL=C sort > migration-files.txt
          if [ ! -s migration-files.txt ]; then
            echo "No database migrations were found." >&2
            exit 1
          fi
          while IFS= read -r migration; do
            sha256sum "$migration"
          done < migration-files.txt > migration-manifest.txt
          last="$(find packages/db/src/migrations -maxdepth 1 -type f -name '*.sql' -print \
            | LC_ALL=C sort | tail -n 1 | xargs basename)"
          count="$(find packages/db/src/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          manifest_digest="$(sha256sum migration-manifest.txt | awk '{print $1}')"
          {
            echo "last=$last"
            echo "count=$count"
            echo "manifest_digest=$manifest_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish release image
        id: image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          build-args: |
            PAPERCLIP_BUILD_VERSION=ragnos/v${{ steps.identity.outputs.version }}
            PAPERCLIP_BUILD_COMMIT=${{ steps.identity.outputs.source_sha }}
            CLI_TOOLS_CACHE_EPOCH=${{ steps.identity.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.identity.outputs.image_tag }}
            ghcr.io/${{ github.repository }}:${{ steps.identity.outputs.source_image_tag }}
          labels: |
            org.opencontainers.image.created=${{ steps.identity.outputs.created_at }}
            org.opencontainers.image.revision=${{ steps.identity.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Paperclip RAGnos backend
            org.opencontainers.image.version=${{ steps.identity.outputs.version }}
            io.github.paperclipai.schema.last-migration=${{ steps.migrations.outputs.last }}
            io.github.paperclipai.schema.migration-count=${{ steps.migrations.outputs.count }}

      - name: Tag the published source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="$SOURCE_SHA" >/dev/null

      - name: Write release receipt
        env:
          CREATED_AT: ${{ steps.identity.outputs.created_at }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TAG: ${{ steps.identity.outputs.image_tag }}
          LAST_MIGRATION: ${{ steps.migrations.outputs.last }}
          MIGRATION_COUNT: ${{ steps.migrations.outputs.count }}
          MIGRATION_MANIFEST_DIGEST: ${{ steps.migrations.outputs.manifest_digest }}
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          jq -n \
            --arg schema "ragnos_paperclip_release_receipt/v1" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$SOURCE_SHA" \
            --arg version "$VERSION" \
            --arg release_tag "$RELEASE_TAG" \
            --arg image "ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg last_migration "$LAST_MIGRATION" \
            --arg migration_count "$MIGRATION_COUNT" \
            --arg migration_manifest_digest "$MIGRATION_MANIFEST_DIGEST" \
            --arg workflow_run "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg created_at "$CREATED_AT" \
            '{
              schema: $schema,
              repository: $repository,
              source_sha: $source_sha,
              version: $version,
              release_tag: $release_tag,
              image: $image,
              image_digest: $image_digest,
              migration: {
                last: $last_migration,
                count: ($migration_count | tonumber),
                migration_manifest_digest: $migration_manifest_digest
              },
              workflow_run: $workflow_run,
              created_at: $created_at,
              platforms: ["linux/amd64"],
              upstream_baseline: "8f8a0ab7effbd6a0584107d8038736c134ee5047",
              upstream_tag: "v2026.1001.0"
            }' > release-receipt.json
          {
            echo "## Paperclip RAGnos fork image published"
            echo
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Release tag: \`$RELEASE_TAG\`"
            echo "- Image: \`ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST}\`"
            echo "- Migrations: $MIGRATION_COUNT, last \`$LAST_MIGRATION\`, manifest \`$MIGRATION_MANIFEST_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release receipt
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paperclip-ragnos-${{ steps.identity.outputs.version }}-release-receipt
          path: release-receipt.json
          if-no-files-found: error
          retention-days: 90
