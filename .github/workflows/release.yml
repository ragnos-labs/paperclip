name: Release Verification

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full commit SHA to verify without publication
        required: true
        type: string
      stable_date:
        description: UTC date in YYYY-MM-DD format for the stable release preview
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-verification-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  verify_stable:
    uses: ./.github/workflows/release-verify.yml
    with:
      ref: ${{ inputs.source_ref }}

  preview_stable:
    needs: verify_stable
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Validate release package manifest
        run: node ./scripts/release-package-map.mjs check

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Preview stable release
        env:
          GITHUB_ACTIONS: "true"
        run: |
          args=(stable --skip-verify --dry-run)
          if [ -n "${{ inputs.stable_date }}" ]; then
            args+=(--date "${{ inputs.stable_date }}")
          fi
          ./scripts/release.sh "${args[@]}"
